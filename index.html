<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- CSS 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단: 로고 및 타이틀 -->
  <header class="header">
    <div class="logo">🐽</div>
    <h1 class="cafe-name">바이브 카페</h1>
    <p class="subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- 주문서 본문 영역 -->
  <main class="order-container">
    <!-- 탭 메뉴: "☕ 주문하기", "📋 주문 내역" -->
    <nav class="tab-menu" aria-label="메인 탭 메뉴">
      <button type="button" class="tab-btn active" id="tabOrderBtn">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tabHistoryBtn">
        📋 주문 내역 <span class="badge" id="orderCountBadge">0</span>
      </button>
    </nav>

    <!-- 1. 주문하기 탭 콘텐츠 -->
    <section id="orderTabContent" class="tab-content">
      <!-- novalidate: 브라우저 기본 유효성 검사 비활성화 (JS 검증용) -->
      <form id="orderForm" novalidate>

      <!-- 1. 이름 입력 (필수) -->
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
      </div>

      <!-- 2. 전화번호 입력 -->
      <div class="form-group">
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="latte" data-price="4000">카페라떼 4,000원</option>
          <option value="mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="greentea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="iced-tea" data-price="3000">아이스티 3,000원</option>
        </select>
      </div>

      <!-- 4. 사이즈 선택 (라디오 버튼) -->
      <div class="form-group">
        <fieldset>
          <legend>사이즈</legend>
          <div class="radio-options">
            <input type="radio" id="sizeS" name="size" value="S" data-price="0">
            <label for="sizeS">S +0원</label>

            <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked>
            <label for="sizeM">M +500원</label>

            <input type="radio" id="sizeL" name="size" value="L" data-price="1000">
            <label for="sizeL">L +1,000원</label>
          </div>
        </fieldset>
      </div>

      <!-- 5. 추가 옵션 선택 (체크박스) -->
      <div class="form-group">
        <fieldset>
          <legend>추가 옵션</legend>
          <div class="checkbox-options">
            <input type="checkbox" id="optShot" name="option" value="shot" data-price="500">
            <label for="optShot">샷 추가 +500원</label>

            <input type="checkbox" id="optCream" name="option" value="cream" data-price="500">
            <label for="optCream">크림 추가 +500원</label>

            <input type="checkbox" id="optSyrup" name="option" value="syrup" data-price="300">
            <label for="optSyrup">시럽 추가 +300원</label>

            <input type="checkbox" id="optDecaf" name="option" value="decaf" data-price="0">
            <label for="optDecaf">디카페인 +0원</label>
          </div>
        </fieldset>
      </div>

      <!-- 6. 수량 입력 -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 입력 -->
      <div class="form-group">
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="3" placeholder="요청사항을 입력해주세요."></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
      <div id="estimatedPrice" class="price-display">
        예상 금액: <span id="priceValue">0</span>원
      </div>

      <!-- 9. 주문하기 & 10. 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submitBtn">주문하기</button>
        <button type="reset" id="resetBtn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (초기 상태 숨김) -->
    <div id="orderConfirmation" class="confirmation-display hidden" hidden></div>
    </section>

    <!-- 2. 주문 내역 탭 콘텐츠 (기본 숨김) -->
    <section id="historyTabContent" class="tab-content hidden">
      <!-- 주문 내역 목록 영역 -->
      <div id="orderList" class="order-list"></div>

      <!-- 주문 내역 합계 요약 및 전체 삭제 버튼 -->
      <div id="historySummary" class="history-summary hidden">
        <div class="total-summary" id="totalOrderSummary">총 주문 금액: 0원 (0건)</div>
        <button type="button" id="clearAllBtn" class="clear-all-btn">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase JS v2 CDN 연결 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JavaScript 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
